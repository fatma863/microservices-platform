apiVersion: v1
kind: Namespace
metadata:
  name: cloud-platform
  labels:
    environment: production
    managed-by: terraform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: cloud-platform
data:
  AUTH_SERVICE_URL: "http://auth-service.cloud-platform.svc.cluster.local:8001"
  CATALOG_SERVICE_URL: "http://catalog-service.cloud-platform.svc.cluster.local:8002"
  ENVIRONMENT: "production"

